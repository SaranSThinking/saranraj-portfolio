<meta charset="utf-8" />
<title>PROJECT WSD - DOIE - Work System Design Laboratory Floor Plan</title>
<style>
  :root {
    --bg: #F5F1E8;
    --surface: #FFFFFF;
    --surface-2: #EBE4D3;
    --border: #D4C9AC;
    --ink: #1B2B3A;
    --ink-muted: #5C6B7A;
    --accent: #B5652D;
    --accent-ink: #FFFFFF;
    --accent-2: #2E7D6B;
    --gold: #C9A227;
    --violet: #5B4B8A;
    --danger: #B23A48;
    --lock: #D8CFB8;
    --line: #D4C9AC;
    --shadow: 0 8px 24px rgba(27,43,58,0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E2439; --surface: #16324D; --surface-2: #1D3E5C; --border: #2E5478;
      --ink: #E8F1F8; --ink-muted: #9FB8CC; --accent: #E08A3E; --accent-ink: #0E2439;
      --accent-2: #4FD8B8; --gold: #E8C547; --violet: #A78BDB; --danger: #F0768A;
      --lock: #2E4A63; --line: #2E5478; --shadow: 0 8px 28px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E2439; --surface: #16324D; --surface-2: #1D3E5C; --border: #2E5478;
    --ink: #E8F1F8; --ink-muted: #9FB8CC; --accent: #E08A3E; --accent-ink: #0E2439;
    --accent-2: #4FD8B8; --gold: #E8C547; --violet: #A78BDB; --danger: #F0768A;
    --lock: #2E4A63; --line: #2E5478; --shadow: 0 8px 28px rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, .display { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; text-wrap: balance; font-weight: 400; letter-spacing: 0.2px; }
  .mono, .stat { font-family: Consolas, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  .eyebrow { text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.72rem; color: var(--ink-muted); font-weight: 600; }
  button { font-family: inherit; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

  #app { min-height: 100vh; display: flex; flex-direction: column; }

  .login-screen { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 20px; position: relative; overflow: hidden; }
  .login-screen::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 36px 36px; opacity: 0.35; pointer-events: none;
  }
  .login-card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; box-shadow: var(--shadow); padding: 40px 36px; max-width: 460px; width: 100%; }
  .login-card .eyebrow { margin-bottom: 10px; }
  .login-card h1 { font-size: 1.85rem; margin: 0 0 8px; }
  .login-card p.sub { color: var(--ink-muted); margin: 0 0 28px; line-height: 1.55; font-size: 0.94rem; }
  .field-label { display: block; font-size: 0.78rem; color: var(--ink-muted); margin-bottom: 6px; font-weight: 600; }
  .login-card input { width: 100%; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; color: var(--ink); font-size: 1rem; margin-bottom: 18px; }
  .login-card input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: var(--accent-ink); border: none; padding: 13px 22px; border-radius: 3px; font-size: 0.95rem; font-weight: 600; cursor: pointer; width: 100%; transition: filter 0.15s ease, transform 0.15s ease; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .login-foot { margin-top: 16px; font-size: 0.78rem; color: var(--ink-muted); text-align: center; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; border-bottom: 1px solid var(--border); background: var(--surface); gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark { font-family: Georgia, serif; font-size: 1.2rem; letter-spacing: 0.02em; }
  .brand .tag { font-size: 0.78rem; color: var(--ink-muted); }
  .hud { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .hud-stat { display: flex; flex-direction: column; align-items: flex-end; }
  .hud-stat .num { font-size: 1.05rem; font-weight: 700; color: var(--accent); }
  .hud-stat .lbl { font-size: 0.68rem; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .hud-name { font-size: 0.85rem; color: var(--ink-muted); }
  .hud-name b { color: var(--ink); }
  .fx-toggle { background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-muted); width: 34px; height: 34px; border-radius: 50%; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.15s ease, border-color 0.15s ease; }
  .fx-toggle:hover { border-color: var(--accent); transform: scale(1.06); }
  .fx-toggle[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .link-btn { background: none; border: none; color: var(--ink-muted); font-size: 0.82rem; cursor: pointer; padding: 4px 0; }
  .link-btn:hover { color: var(--accent); }

  .atlas-wrap { flex: 1; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.9fr); gap: 0; }
  .atlas-main { padding: 28px 28px 60px; overflow-x: auto; }
  .atlas-main h2 { font-size: 1.5rem; margin: 0 0 4px; }
  .atlas-main .sub { color: var(--ink-muted); font-size: 0.92rem; margin: 0 0 24px; max-width: 62ch; line-height: 1.6; }
  .map-svg { width: 100%; height: auto; min-width: 560px; }
  .map-line { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
  .map-line.done { stroke: var(--accent-2); stroke-dasharray: none; }
  .node-group { cursor: pointer; }
  .node-group:focus-visible rect.node-ring { outline: 2px solid var(--ink); }
  .node-ring { fill: var(--surface); stroke: var(--lock); stroke-width: 2.5; transition: stroke 0.2s ease, fill 0.2s ease; }
  .node-group.active .node-ring { stroke: var(--accent); animation: pulse 2.2s ease-in-out infinite; }
  .node-group.done .node-ring { stroke: var(--accent-2); fill: var(--accent-2); }
  .node-group.locked .node-ring { stroke: var(--lock); }
  @keyframes pulse { 0%, 100% { filter: drop-shadow(0 0 0 rgba(224,138,62,0)); } 50% { filter: drop-shadow(0 0 7px var(--accent)); } }
  .node-icon { font-size: 18px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .node-group.locked .node-icon { opacity: 0.45; }
  .node-label { font-size: 11.5px; text-anchor: middle; fill: var(--ink); font-family: "Segoe UI", sans-serif; pointer-events: none; }
  .node-num { font-size: 9px; text-anchor: middle; fill: var(--ink-muted); font-family: Consolas, monospace; letter-spacing: 0.04em; pointer-events: none; }

  .side-panel { border-left: 1px solid var(--border); background: var(--surface); padding: 26px 24px; display: flex; flex-direction: column; gap: 22px; }
  .progress-block .eyebrow { margin-bottom: 10px; }
  .progress-bar-track { height: 8px; background: var(--surface-2); border-radius: 5px; overflow: hidden; margin-bottom: 8px; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 5px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }
  .progress-count { font-size: 0.8rem; color: var(--ink-muted); }
  .proofs-list { display: flex; flex-direction: column; gap: 10px; }
  .proof-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; background: var(--surface-2); border-radius: 3px; border: 1px solid var(--border); opacity: 0.4; }
  .proof-row.earned { opacity: 1; }
  .proof-icon { font-size: 1.1rem; width: 22px; text-align: center; }
  .proof-name { font-size: 0.82rem; }
  .proof-name .sub { display: block; font-size: 0.7rem; color: var(--ink-muted); }
  .how-block { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 16px; }
  .how-block h3 { font-size: 0.9rem; margin: 0 0 8px; }
  .how-block p { font-size: 0.8rem; color: var(--ink-muted); line-height: 1.6; margin: 0; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(14,36,57,0.55); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50; }
  .modal-card { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; box-shadow: var(--shadow); max-width: 640px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 30px 32px 28px; }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
  .modal-head .eyebrow { color: var(--accent); }
  .modal-close { background: none; border: none; color: var(--ink-muted); font-size: 1.1rem; cursor: pointer; line-height: 1; padding: 4px; }
  .modal-close:hover { color: var(--ink); }
  .modal-card h2 { font-size: 1.28rem; margin: 4px 0 16px; }
  .scenario-box { background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 0 3px 3px 0; padding: 14px 16px; font-size: 0.92rem; line-height: 1.6; margin-bottom: 16px; }
  .industry-note { background: color-mix(in srgb, var(--gold) 14%, var(--surface)); border: 1px dashed var(--gold); border-radius: 3px; padding: 10px 14px; font-size: 0.82rem; line-height: 1.55; margin-bottom: 18px; }
  .industry-note b.tag { color: var(--gold); }
  .step-label { font-size: 0.78rem; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .options { display: flex; flex-direction: column; gap: 9px; margin-bottom: 6px; }
  .option-btn { text-align: left; background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; padding: 12px 14px; font-size: 0.88rem; line-height: 1.5; color: var(--ink); cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease; }
  .option-btn:hover { border-color: var(--accent); }
  .option-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .option-btn.correct { border-color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 16%, var(--surface-2)); }
  .option-btn.wrong { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, var(--surface-2)); }
  .option-letter { font-family: Consolas, monospace; font-weight: 700; margin-right: 8px; color: var(--ink-muted); }
  .hint-box { display: flex; gap: 10px; align-items: flex-start; background: color-mix(in srgb, var(--danger) 10%, var(--surface)); border: 1px solid var(--danger); border-radius: 3px; padding: 12px 14px; margin-top: 14px; font-size: 0.85rem; line-height: 1.55; }
  .hint-box .tag { font-weight: 700; color: var(--danger); flex-shrink: 0; }
  .concept-reveal { margin-top: 22px; background: color-mix(in srgb, var(--accent-2) 10%, var(--surface)); border: 1px solid var(--accent-2); border-radius: 4px; padding: 18px 20px; }
  .concept-reveal .eyebrow { color: var(--accent-2); margin-bottom: 8px; }
  .concept-reveal h3 { font-size: 1.05rem; margin: 0 0 10px; }
  .concept-reveal p, .concept-reveal li { font-size: 0.87rem; line-height: 1.65; color: var(--ink); }
  .concept-reveal .xp-line { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .xp-badge { font-size: 0.85rem; font-weight: 700; color: var(--accent-2); }
  .step-nav { display: flex; justify-content: flex-end; margin-top: 18px; gap: 10px; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--ink-muted); padding: 10px 16px; border-radius: 3px; font-size: 0.85rem; cursor: pointer; }
  .btn-ghost:hover { color: var(--ink); border-color: var(--ink-muted); }

  /* calc / sim widgets */
  .calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .calc-field { background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; padding: 10px 12px; }
  .calc-field .k { font-size: 0.72rem; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
  .calc-field .v { font-size: 1.05rem; font-weight: 700; font-family: Consolas, monospace; }
  .calc-input-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 6px; }
  .calc-input-row .col { flex: 1; min-width: 200px; }
  .calc-input-row input[type="number"], .calc-input-row input[type="text"] {
    width: 100%; padding: 11px 13px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 3px; color: var(--ink); font-size: 1rem; font-family: Consolas, monospace;
  }
  .calc-input-row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .calc-result { margin-top: 14px; padding: 12px 14px; border-radius: 3px; font-size: 0.87rem; }
  .calc-result.ok { background: color-mix(in srgb, var(--accent-2) 14%, var(--surface)); border: 1px solid var(--accent-2); color: var(--ink); }
  .calc-result.bad { background: color-mix(in srgb, var(--danger) 12%, var(--surface)); border: 1px solid var(--danger); color: var(--ink); }
  .sim-bars { display: flex; gap: 3px; align-items: flex-end; height: 60px; margin: 14px 0; padding: 8px; background: var(--surface-2); border-radius: 3px; border: 1px solid var(--border); overflow-x: auto; }
  .sim-bar { width: 6px; flex-shrink: 0; border-radius: 1px 1px 0 0; }
  .sim-bar.working { background: var(--accent-2); }
  .sim-bar.idle { background: var(--lock); }
  .sim-readout { display: flex; gap: 22px; flex-wrap: wrap; margin: 10px 0 16px; }
  .sim-readout .item .k { font-size: 0.72rem; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .sim-readout .item .v { font-size: 1.3rem; font-weight: 700; font-family: Consolas, monospace; color: var(--accent); }

  .complete-screen { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
  .complete-card { max-width: 560px; width: 100%; text-align: center; background: var(--surface); border: 1px solid var(--accent-2); border-radius: 5px; box-shadow: var(--shadow); padding: 44px 36px; }
  .complete-card .eyebrow { color: var(--accent-2); justify-content: center; display: block; margin-bottom: 10px; }
  .complete-card h1 { font-size: 2rem; margin: 0 0 14px; }
  .complete-card p.sub { color: var(--ink-muted); line-height: 1.6; margin: 0 0 26px; }
  .badge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 28px; }
  .badge-grid .proof-row { flex-direction: column; text-align: center; opacity: 1; padding: 12px 6px; }
  .badge-grid .proof-icon { font-size: 1.5rem; width: auto; }
  .badge-grid .proof-name { font-size: 0.68rem; }
  .cta-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .btn-capstone { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: var(--accent-ink); border: none; padding: 15px 22px; border-radius: 3px; font-size: 0.98rem; font-weight: 700; cursor: pointer; width: 100%; transition: filter 0.15s ease, transform 0.15s ease; }
  .btn-capstone:hover { filter: brightness(1.06); }
  .btn-capstone:active { transform: scale(0.98); }

  .studio-wrap { flex: 1; padding: 30px 28px 70px; max-width: 900px; margin: 0 auto; width: 100%; }
  .studio-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
  .brief-card { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 24px 26px; margin-bottom: 26px; box-shadow: var(--shadow); }
  .brief-card .eyebrow { color: var(--accent); margin-bottom: 8px; }
  .brief-card h1 { font-size: 1.55rem; margin: 0 0 12px; }
  .brief-card p { font-size: 0.92rem; line-height: 1.65; color: var(--ink); margin: 0 0 10px; }
  .brief-card p:last-child { margin-bottom: 0; }
  .milestone-card { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 20px 24px; margin-bottom: 16px; }
  .milestone-card.locked { opacity: 0.5; }
  .milestone-card.done { border-color: var(--accent-2); }
  .milestone-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .milestone-head .eyebrow { margin-bottom: 4px; }
  .milestone-head h2 { font-size: 1.1rem; margin: 0; }
  .milestone-done-badge { font-size: 0.76rem; font-weight: 700; color: var(--accent-2); white-space: nowrap; padding-top: 4px; }
  .milestone-lock-note { font-size: 0.82rem; color: var(--ink-muted); margin-top: 4px; }
  .milestone-goal { font-size: 0.9rem; line-height: 1.6; margin: 10px 0 10px; }
  .milestone-why { background: var(--surface-2); border-left: 3px solid var(--accent-2); border-radius: 0 3px 3px 0; padding: 10px 14px; font-size: 0.84rem; line-height: 1.6; color: var(--ink); margin-bottom: 14px; }
  .milestone-why b.tag { color: var(--accent-2); }
  .checklist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .check-row { display: flex; align-items: flex-start; gap: 9px; font-size: 0.87rem; line-height: 1.5; cursor: pointer; }
  .check-row input[type="checkbox"] { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent-2); flex-shrink: 0; cursor: pointer; }
  .check-row.checked span { color: var(--ink-muted); text-decoration: line-through; text-decoration-color: var(--accent-2); }
  .guidance-box { background: color-mix(in srgb, var(--accent) 8%, var(--surface)); border: 1px solid var(--accent); border-radius: 3px; padding: 10px 14px; font-size: 0.83rem; line-height: 1.6; margin-bottom: 14px; }
  .guidance-box b.tag { color: var(--accent); }
  .reflect-label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .reflect-box { width: 100%; min-height: 90px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; color: var(--ink); font-size: 0.87rem; font-family: inherit; line-height: 1.55; resize: vertical; margin-bottom: 6px; }
  .reflect-box:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .portfolio-tip { font-size: 0.78rem; color: var(--ink-muted); margin-bottom: 14px; }
  .portfolio-tip b.tag { color: var(--ink); }
  .milestone-actions { display: flex; justify-content: flex-end; }
  .packet-card { background: var(--surface); border: 1px solid var(--accent-2); border-radius: 5px; padding: 24px 26px; margin-top: 6px; }
  .packet-card h2 { font-size: 1.2rem; margin: 0 0 8px; }
  .packet-card .eyebrow { color: var(--accent-2); margin-bottom: 8px; }
  .packet-preview { width: 100%; min-height: 220px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; padding: 12px 14px; font-family: Consolas, monospace; font-size: 0.78rem; line-height: 1.5; color: var(--ink); margin: 14px 0; white-space: pre-wrap; }
  .packet-status { font-size: 0.8rem; margin-top: 10px; color: var(--ink-muted); }
  .packet-status.err { color: var(--danger); }
  .packet-status.ok { color: var(--accent-2); }

  /* chart-building / rating-worksheet widgets */
  .chart-hands-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 6px; }
  @media (max-width: 560px) { .chart-hands-wrap { grid-template-columns: 1fr; } }
  .chart-hand-label { font-size: 0.78rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .chart-steps { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .chart-step-row { background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; padding: 10px 12px; transition: border-color 0.15s ease; }
  .chart-step-row.correct { border-color: var(--accent-2); }
  .chart-step-row.wrong { border-color: var(--danger); }
  .chart-step-desc { font-size: 0.86rem; line-height: 1.5; margin-bottom: 8px; }
  .symbol-btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .symbol-btn {
    background: var(--surface); border: 1px solid var(--border); border-radius: 3px;
    padding: 6px 11px; font-size: 0.85rem; cursor: pointer; color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px; transition: border-color 0.15s ease, background 0.15s ease;
  }
  .symbol-btn .sym { font-family: Consolas, monospace; font-weight: 700; font-size: 1rem; }
  .symbol-btn:hover { border-color: var(--accent); }
  .symbol-btn.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); font-weight: 600; }
  .chart-step-row.correct .symbol-btn.selected { border-color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 16%, var(--surface)); }

          (calcWrong ? '<div class="calc-result bad"><b>Not quite.</b> ' + esc(lvl.formulaHint) + '</div>' : '');
      } else {
        body = awardAndReveal(lvl);
      }
    } else if (lvl.type === "sim") {
      if (stepIndex === 0) {
        var lastRun = simRuns.length ? simRuns[simRuns.length - 1] : null;
        var barsHtml = "";
        if (lastRun) {
          barsHtml = '<div class="sim-bars">' + lastRun.sequence.map(function (w) { return '<div class="sim-bar ' + (w ? "working" : "idle") + '" style="height:' + (w ? 100 : 45) + '%;"></div>'; }).join("") + '</div>';
        }
        var readoutHtml = lastRun
          ? '<div class="sim-readout"><div class="item"><div class="k">Simulated Utilization</div><div class="v">' + lastRun.pct.toFixed(1) + '%</div></div><div class="item"><div class="k">True Value</div><div class="v">' + (lastRun.p * 100).toFixed(1) + '%</div></div><div class="item"><div class="k">Error</div><div class="v">' + Math.abs(lastRun.pct - lastRun.p * 100).toFixed(1) + ' pts</div></div></div>'
          : '';
        body = '<div class="scenario-box">' + escKeepTags(lvl.scenario) + '</div>' + noteHtml +
          '<div class="step-label">Run the simulation</div>' +
          '<div class="calc-input-row">' +
            '<div class="col"><label class="field-label">True utilization (0–1)</label><input type="number" step="0.01" min="0" max="1" id="simP" value="' + lvl.simDefaults.p + '" /></div>' +
            '<div class="col"><label class="field-label">Number of observations (N)</label><input type="number" step="1" min="1" max="2000" id="simN" value="' + lvl.simDefaults.n + '" /></div>' +
            '<button class="btn-primary" id="simRunBtn" style="width:auto;">Run Simulation →</button>' +
          '</div>' +
          barsHtml + readoutHtml +
          (lastRun ? (
            '<div class="step-label" style="margin-top:18px;">' + esc(lvl.followup.q) + '</div>' +
            renderOptionList(lvl.followup.options, simFollowupChosen, simFollowupChosen !== null && !lvl.followup.options[simFollowupChosen].c ? false : simFollowupChosen !== null) +
            (showHint ? '<div class="hint-box"><span class="tag">Think again -</span><span>Try running the simulation once with a small N (like 10) and once with a large N (like 1000) - compare how much the result swings each time you re-run it. <b>Pick another option below to try again.</b></span></div>' : '') +
            '<div class="step-nav">' + (simFollowupChosen !== null && lvl.followup.options[simFollowupChosen].c ? '<button class="btn-primary" id="nextStepBtn" style="width:auto;">Reveal the concept →</button>' : '') + '</div>'
          ) : '');
      } else {
        body = awardAndReveal(lvl);
      }
    } else if (lvl.type === "chart") {
      if (stepIndex === 0) {
        var symbolKeyHtml = buildSymbolKey(lvl.symbolSet);
        var chartBodyHtml;
        if (lvl.hands) {
          chartBodyHtml = '<div class="chart-hands-wrap">' +
            '<div><div class="chart-hand-label">Left Hand</div><div class="chart-steps" id="chartStepsLeft">' +
              lvl.leftSteps.map(function (s, i) { return buildChartStepRow(s, i, chartAssignLeft, lvl.symbolSet, chartChecked); }).join("") +
            '</div></div>' +
            '<div><div class="chart-hand-label">Right Hand</div><div class="chart-steps" id="chartStepsRight">' +
              lvl.rightSteps.map(function (s, i) { return buildChartStepRow(s, i, chartAssignRight, lvl.symbolSet, chartChecked); }).join("") +
            '</div></div>' +
          '</div>';
        } else {
          chartBodyHtml = '<div class="chart-steps" id="chartSteps">' +
            lvl.steps.map(function (s, i) { return buildChartStepRow(s, i, chartAssign, lvl.symbolSet, chartChecked); }).join("") +
          '</div>';
        }
        var allFilled = lvl.hands
          ? chartAssignLeft.every(function (v) { return v !== null; }) && chartAssignRight.every(function (v) { return v !== null; })
          : chartAssign.every(function (v) { return v !== null; });
        body = '<div class="scenario-box">' + escKeepTags(lvl.scenario) + '</div>' + noteHtml +
          '<div class="step-label">Build the chart - click a symbol for each step</div>' +
          symbolKeyHtml + chartBodyHtml +
          (chartChecked ? '<div class="hint-box"><span class="tag">Not quite -</span><span>' + esc(lvl.hint) + ' Fix the highlighted step(s) and check again.</span></div>' : '') +
          '<div class="step-nav"><button class="btn-primary" id="chartCheckBtn" style="width:auto;"' + (allFilled ? '' : ' disabled') + '>Check my chart →</button></div>';
      } else {
        body = awardAndReveal(lvl);
      }
    } else if (lvl.type === "rate") {
      if (stepIndex === 0) {
        var factorRowsHtml = lvl.factors.map(function (f, i) {
          var chosen = rateAssign[i];
          var isCorrect = rateChecked && chosen === f.correct;
          var isWrong = rateChecked && chosen !== null && chosen !== f.correct;
          var rowClass = "rate-factor-row" + (isCorrect ? " correct" : "") + (isWrong ? " wrong" : "");
          var btns = lvl.levels.map(function (lv) {
            var sel = chosen === lv.name;
            return '<button class="level-btn' + (sel ? " selected" : "") + '" data-idx="' + i + '" data-level="' + esc(lv.name) + '">' + esc(lv.name) + '</button>';
          }).join("");
          return '<div class="' + rowClass + '"><div class="rate-factor-name">' + esc(f.name) + '</div><div class="rate-factor-desc">' + esc(f.desc) + '</div><div class="level-btn-group">' + btns + '</div></div>';
        }).join("");
        var allFilledR = rateAssign.every(function (v) { return v !== null; });
        body = '<div class="scenario-box">' + escKeepTags(lvl.scenario) + '</div>' + noteHtml +
          '<div class="step-label">Fill out the rating worksheet</div>' +
          factorRowsHtml +
          (rateChecked ? '<div class="hint-box"><span class="tag">Not quite -</span><span>' + esc(lvl.hint) + ' Fix the highlighted factor(s) and check again.</span></div>' : '') +
          '<div class="step-nav"><button class="btn-primary" id="rateCheckBtn" style="width:auto;"' + (allFilledR ? '' : ' disabled') + '>Check my rating →</button></div>';
      } else {
        body = awardAndReveal(lvl);
      }
    }

    overlay.innerHTML =
      '<div class="modal-card">' +
        '<div class="modal-head"><div><div class="eyebrow">Station ' + lvl.id + (lvl.boss ? " · Capstone Prep" : "") + ' · ' + esc(lvl.module) + '</div>' +
        '<h2 class="display">' + lvl.icon + '&nbsp; ' + esc(lvl.title) + '</h2></div>' +
        '<button class="modal-close" id="modalCloseBtn" aria-label="Close">✕</button></div>' +
        body +
      '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector("#modalCloseBtn").addEventListener("click", function () { overlay.remove(); closeLevel(); });
    overlay.addEventListener("click", function (e) { if (e.target === overlay) { overlay.remove(); closeLevel(); } });

    if (lvl.type === "reason") {
      if (stepIndex === 0) {
        var aOpts = overlay.querySelectorAll(".options")[0].querySelectorAll(".option-btn");
        aOpts.forEach(function (btn, idx) {
          btn.addEventListener("click", function () {
            if (chosenApproach !== null && lvl.approach[chosenApproach].c) return;
            chosenApproach = idx; showHint = !lvl.approach[idx].c;
            if (showHint) wrongAttempts++;
            rerenderModalOnly();
          });
        });
        var next = overlay.querySelector("#nextStepBtn");
        if (next) next.addEventListener("click", function () { stepIndex = 1; showHint = false; rerenderModalOnly(); });
      } else if (stepIndex === 1) {
        var jOpts = overlay.querySelectorAll(".options")[0].querySelectorAll(".option-btn");
        jOpts.forEach(function (btn, idx) {
          btn.addEventListener("click", function () {
            if (chosenJustification !== null && lvl.justification[chosenJustification].c) return;
            chosenJustification = idx; showHint = !lvl.justification[idx].c;
            if (showHint) wrongAttempts++;
            rerenderModalOnly();
          });
        });
        var next2 = overlay.querySelector("#nextStepBtn");
        if (next2) next2.addEventListener("click", function () { stepIndex = 2; rerenderModalOnly(); });
      } else {
        overlay.querySelector("#backToAtlasBtn").addEventListener("click", function () { overlay.remove(); closeLevel(); });
      }
    } else if (lvl.type === "calc") {
      if (stepIndex === 0) {
        var checkBtn = overlay.querySelector("#calcCheckBtn");
        var input = overlay.querySelector("#calcInput");
        checkBtn.addEventListener("click", function () {
          var val = parseFloat(input.value);
          if (isNaN(val)) { calcWrong = true; wrongAttempts++; rerenderModalOnly(); return; }
          if (Math.abs(val - lvl.answer) <= lvl.tolerance) { calcWrong = false; stepIndex = 1; rerenderModalOnly(); }
          else { calcWrong = true; wrongAttempts++; rerenderModalOnly(); }
        });
        input.addEventListener("keydown", function (e) { if (e.key === "Enter") checkBtn.click(); });
      } else {
        overlay.querySelector("#backToAtlasBtn").addEventListener("click", function () { overlay.remove(); closeLevel(); });
      }
    } else if (lvl.type === "sim") {
      if (stepIndex === 0) {
        var runBtn = overlay.querySelector("#simRunBtn");
        runBtn.addEventListener("click", function () {
          var pVal = parseFloat(overlay.querySelector("#simP").value);
          var nVal = parseInt(overlay.querySelector("#simN").value, 10);
          if (isNaN(pVal) || pVal < 0 || pVal > 1) pVal = lvl.simDefaults.p;
          if (isNaN(nVal) || nVal < 1) nVal = lvl.simDefaults.n;
          nVal = Math.min(nVal, 2000);
          var sequence = [];
          var workingCount = 0;
          for (var i = 0; i < nVal; i++) {
            var w = Math.random() < pVal;
            if (w) workingCount++;
            sequence.push(w);
          }
          simRuns.push({ p: pVal, n: nVal, pct: (workingCount / nVal) * 100, sequence: sequence.slice(0, 300) });
          rerenderModalOnly();
        });
        var fOpts = overlay.querySelectorAll(".options");
        if (fOpts.length) {
          fOpts[0].querySelectorAll(".option-btn").forEach(function (btn, idx) {
            btn.addEventListener("click", function () {
              if (simFollowupChosen !== null && lvl.followup.options[simFollowupChosen].c) return;
              simFollowupChosen = idx; showHint = !lvl.followup.options[idx].c;
              if (showHint) wrongAttempts++;
              rerenderModalOnly();
            });
          });
        }
        var next3 = overlay.querySelector("#nextStepBtn");
        if (next3) next3.addEventListener("click", function () { stepIndex = 1; rerenderModalOnly(); });
      } else {
        overlay.querySelector("#backToAtlasBtn").addEventListener("click", function () { overlay.remove(); closeLevel(); });
      }
    } else if (lvl.type === "chart") {
      if (stepIndex === 0) {
        function bindSymbolGroup(containerId, assignArr) {
          var container = overlay.querySelector("#" + containerId);
          if (!container) return;
          container.querySelectorAll(".symbol-btn").forEach(function (btn) {
            btn.addEventListener("click", function () {
              var idx = parseInt(btn.getAttribute("data-idx"), 10);
              assignArr[idx] = btn.getAttribute("data-sym");
              chartChecked = false;
              rerenderModalOnly();
            });
          });
        }
        if (lvl.hands) { bindSymbolGroup("chartStepsLeft", chartAssignLeft); bindSymbolGroup("chartStepsRight", chartAssignRight); }
        else { bindSymbolGroup("chartSteps", chartAssign); }
        var chartCheckBtn = overlay.querySelector("#chartCheckBtn");
        if (chartCheckBtn) chartCheckBtn.addEventListener("click", function () {
          var allCorrect = lvl.hands
            ? lvl.leftSteps.every(function (s, i) { return chartAssignLeft[i] === s.correct; }) && lvl.rightSteps.every(function (s, i) { return chartAssignRight[i] === s.correct; })
            : lvl.steps.every(function (s, i) { return chartAssign[i] === s.correct; });
          chartChecked = true;
          if (allCorrect) { stepIndex = 1; } else { wrongAttempts++; }
          rerenderModalOnly();
        });
      } else {
        overlay.querySelector("#backToAtlasBtn").addEventListener("click", function () { overlay.remove(); closeLevel(); });
      }
    } else if (lvl.type === "rate") {
      if (stepIndex === 0) {
        overlay.querySelectorAll(".level-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var idx = parseInt(btn.getAttribute("data-idx"), 10);
            rateAssign[idx] = btn.getAttribute("data-level");
            rateChecked = false;
            rerenderModalOnly();
          });
        });
        var rateCheckBtn = overlay.querySelector("#rateCheckBtn");
        if (rateCheckBtn) rateCheckBtn.addEventListener("click", function () {
          var allCorrect = lvl.factors.every(function (f, i) { return rateAssign[i] === f.correct; });
          rateChecked = true;
          if (allCorrect) { stepIndex = 1; } else { wrongAttempts++; }
          rerenderModalOnly();
        });
      } else {
        overlay.querySelector("#backToAtlasBtn").addEventListener("click", function () { overlay.remove(); closeLevel(); });
      }
    }
    window._wsdOverlay = overlay;
  }
  function rerenderModalOnly() { if (window._wsdOverlay) window._wsdOverlay.remove(); renderModal(); }

  function renderBridge() {
    var badgeHtml = LEVELS.map(function (lvl) { return '<div class="proof-row earned"><div class="proof-icon">✅</div><div class="proof-name">' + esc(lvl.title) + '</div></div>'; }).join("");
    app.innerHTML =
      '<div class="topbar">' +
        '<div class="brand"><span class="mark display">PROJECT WSD - DOIE</span><span class="tag">Work System Design Laboratory Floor Plan</span></div>' +
        '<div class="hud"><div class="hud-name">Analyst: <b>' + esc(state.name) + '</b></div><div class="hud-stat"><span class="num stat">' + state.xp + '</span><span class="lbl">Study Pts</span></div>' + switchStudentHtml() + fxToggleHtml() + '</div>' +
      '</div>' +
      '<div class="complete-screen"><div class="complete-card">' +
        '<span class="eyebrow">Floor plan fully charted</span><h1 class="display">Qualified Analyst</h1>' +
        '<p class="sub">' + esc(state.name) + ', you completed all 8 projects at ' + esc(COMPANY) + ' - charting real processes, rating real performance, calculating real standard times, and running a real work-sampling simulation. Now put it all together on a task of your own.</p>' +
        '<div class="cta-row"><button class="btn-capstone" id="beginCapstoneBtn">Begin the Independent Audit →</button></div>' +
        '<div class="badge-grid">' + badgeHtml + '</div>' +
        '<button class="btn-ghost" id="resetBtn">Reset progress &amp; start over</button>' +
      '</div></div>';
    document.getElementById("beginCapstoneBtn").addEventListener("click", function () { state.capstone.lastView = "studio"; saveState(state); render(); });
    document.getElementById("resetBtn").addEventListener("click", function () {
      if (confirm("Reset all progress for " + state.name + "? This can't be undone.")) { localStorage.removeItem(STORAGE_PREFIX + state.roll.toUpperCase()); state = null; render(); }
    });
    bindFxToggle(); bindSwitchStudent();
    if (!state.atlasCelebrated) { state.atlasCelebrated = true; saveState(state); celebrate(true); }
  }

  function milestoneStatus(id) {
    var st = state.capstone.milestones[id];
    if (st.done) return "done";
    var prev = id - 1;
    if (prev === 0 || state.capstone.milestones[prev].done) return "active";
    return "locked";
  }
  function buildMilestoneCard(m) {
    var status = milestoneStatus(m.id);
    var ms = state.capstone.milestones[m.id];
    if (status === "locked") {
      return '<div class="milestone-card locked"><div class="milestone-head"><div><div class="eyebrow">Milestone ' + m.id + ' · ' + esc(m.tie) + '</div><h2 class="display">' + esc(m.title) + '</h2></div></div><div class="milestone-lock-note">🔒 Complete Milestone ' + (m.id - 1) + ' first.</div></div>';
    }
    var checklistHtml = m.checklist.map(function (item, cidx) {
      var checked = ms.checks[cidx];
      return '<label class="check-row' + (checked ? ' checked' : '') + '"><input type="checkbox" data-milestone="' + m.id + '" data-check="' + cidx + '"' + (checked ? " checked" : "") + ' /><span>' + esc(item) + '</span></label>';
    }).join("");
    var allChecked = ms.checks.every(function (c) { return c; });
    return '<div class="milestone-card' + (status === "done" ? " done" : "") + '" data-mcard="' + m.id + '">' +
      '<div class="milestone-head"><div><div class="eyebrow">Milestone ' + m.id + ' · ' + esc(m.tie) + '</div><h2 class="display">' + esc(m.title) + '</h2></div>' + (status === "done" ? '<div class="milestone-done-badge">✓ Complete</div>' : '') + '</div>' +
      '<p class="milestone-goal">' + esc(m.goal) + '</p>' +
      '<div class="milestone-why"><b class="tag">Why it matters -</b> ' + esc(m.why) + '</div>' +
      '<div class="checklist">' + checklistHtml + '</div>' +
      '<div class="guidance-box"><b class="tag">Think about -</b> ' + esc(m.guidance) + '</div>' +
      '<label class="reflect-label" for="reflect-' + m.id + '">' + esc(m.reflectPrompt) + '</label>' +
      '<textarea class="reflect-box" id="reflect-' + m.id + '" data-milestone="' + m.id + '" placeholder="Write a few sentences - this feeds your report packet.">' + esc(ms.reflection) + '</textarea>' +
      '<div class="portfolio-tip"><b class="tag">Report tip:</b> ' + esc(m.tip) + '</div>' +
      (status !== "done" ? '<div class="milestone-actions"><button class="btn-primary" style="width:auto;" id="complete-' + m.id + '"' + (allChecked ? "" : " disabled") + '>Mark milestone complete →</button></div>' : '') +
    '</div>';
  }
  function buildReportMarkdown() {
    var ms = state.capstone.milestones;
    var lines = [];
    lines.push("# " + CAPSTONE_BASE.title);
    lines.push(""); lines.push("**Author:** " + state.name);
    lines.push("**Course:** IE23901 - Work System Design Laboratory · drafted with PROJECT WSD - DOIE");
    lines.push(""); lines.push("## Job Selected & Justification"); lines.push(ms[1].reflection || "_(not filled in)_");
    lines.push(""); lines.push("## Current Method (Recording)"); lines.push(ms[2].reflection || "_(not filled in)_");
    lines.push(""); lines.push("## Examination & Improvements (ECRS + Motion Economy)"); lines.push(ms[3].reflection || "_(not filled in)_");
    lines.push(""); lines.push("## Before/After Timing & Honest Evaluation"); lines.push(ms[4].reflection || "_(not filled in)_");
    lines.push(""); lines.push("## What I'd Check First On a New Task"); lines.push(ms[5].reflection || "_(not filled in)_");
    lines.push(""); lines.push("## Skills Demonstrated");
    lines.push("- Process charting: Outline, Flow, and Two-Handed charts (Stations 1-3)");
    lines.push("- Performance rating: Pace Rating and the Westinghouse system (Stations 4-5)");
    lines.push("- Standard time determination: OT -> NT -> ST (Station 6)");
    lines.push("- Statistical work sampling via Monte Carlo simulation (Station 7)");
    lines.push("- Predetermined Motion Time Systems / MTM (Station 8)");
    lines.push(""); lines.push("---"); lines.push("_Drafted via PROJECT WSD - DOIE - Work System Design Laboratory Floor Plan, IE23901._");
    return lines.join("\n");
  }
  function setPacketStatus(container, msg, kind) { var el = container.querySelector("#packetStatus"); if (!el) return; el.textContent = msg; el.className = "packet-status" + (kind ? " " + kind : ""); }
  function handleDownloadPacket(container) {
    var md = buildReportMarkdown();
    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename: "METHOD-STUDY-REPORT.md", data: md }).then(function () {
        state.capstone.packetDownloaded = true; saveState(state);
        setPacketStatus(container, "Saved - check your downloads.", "ok");
      }).catch(function (err) {
        var code = err && err.code ? err.code : "unavailable";
        var msg = code === "declined" ? "No problem - copy the text below instead whenever you're ready." : "Couldn't save automatically (" + code + ") - copy the text below instead.";
        setPacketStatus(container, msg, "err");
      });
    } else { setPacketStatus(container, "Downloads aren't available in this preview - copy the text below instead.", "err"); }
  }
  function renderCapstone() {
    var clearedCount = Object.keys(state.cleared).length;
    var allMilestonesDone = CAPSTONE_BASE.milestones.every(function (m) { return state.capstone.milestones[m.id].done; });
    var milestonesHtml = CAPSTONE_BASE.milestones.map(buildMilestoneCard).join("");
    var packetHtml = "";
    if (allMilestonesDone) {
      packetHtml = '<div class="packet-card"><div class="eyebrow">All 5 milestones complete</div><h2 class="display">Generate Your Method Study Report</h2>' +
        '<p style="font-size:0.88rem;line-height:1.6;color:var(--ink-muted);margin:0;">Drafted from what you wrote in each milestone above.</p>' +
        '<div class="milestone-actions" style="margin-top:14px;"><button class="btn-primary" style="width:auto;" id="downloadPacketBtn">Download Report →</button></div>' +
        '<div id="packetStatus" class="packet-status"></div><textarea class="packet-preview" id="packetPreview" readonly></textarea></div>';
    }
    app.innerHTML =
      '<div class="topbar"><div class="brand"><span class="mark display">PROJECT WSD - DOIE</span><span class="tag">Independent Audit</span></div>' +
      '<div class="hud"><div class="hud-name">Analyst: <b>' + esc(state.name) + '</b></div><div class="hud-stat"><span class="num stat">' + state.xp + '</span><span class="lbl">Study Pts</span></div>' +
      '<div class="hud-stat"><span class="num stat">' + clearedCount + '/' + LEVELS.length + '</span><span class="lbl">Stations Charted</span></div>' + switchStudentHtml() + fxToggleHtml() + '</div></div>' +
      '<div class="studio-wrap"><div class="studio-nav"><button class="link-btn" id="backToAtlasNav">← Back to the Floor Plan</button></div>' +
      '<div class="brief-card"><div class="eyebrow">Independent Audit</div><h1 class="display">' + esc(CAPSTONE_BASE.title) + '</h1>' +
      CAPSTONE_BASE.brief.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join("") +
      '<p><b>Need an idea?</b> Kitchen tasks (making tea, chopping vegetables), desk tasks (filing notes, packing a bag), household chores (folding laundry, washing dishes), or a personal routine (getting ready in the morning) all work well.</p></div>' +
      milestonesHtml + packetHtml + '</div>';
    document.getElementById("backToAtlasNav").addEventListener("click", function () { state.capstone.lastView = "bridge"; saveState(state); render(); });
    app.querySelectorAll('input[type="checkbox"][data-milestone]').forEach(function (cb) {
      cb.addEventListener("change", function () {
        var mid = parseInt(cb.getAttribute("data-milestone"), 10); var cidx = parseInt(cb.getAttribute("data-check"), 10);
        state.capstone.milestones[mid].checks[cidx] = cb.checked; saveState(state); render();
      });
    });
    app.querySelectorAll("textarea.reflect-box[data-milestone]").forEach(function (ta) {
      ta.addEventListener("input", function () { var mid = parseInt(ta.getAttribute("data-milestone"), 10); state.capstone.milestones[mid].reflection = ta.value; saveState(state); });
    });
    CAPSTONE_BASE.milestones.forEach(function (m) {
      var btn = document.getElementById("complete-" + m.id);
      if (btn) { btn.addEventListener("click", function () { state.capstone.milestones[m.id].done = true; saveState(state); celebrate(false); render(); }); }
    });
    if (allMilestonesDone) {
      var preview = document.getElementById("packetPreview");
      if (preview) preview.value = buildReportMarkdown();
      var dlBtn = document.getElementById("downloadPacketBtn");
      if (dlBtn) dlBtn.addEventListener("click", function () { handleDownloadPacket(app); });
      if (!state.capstone.celebrated) { state.capstone.celebrated = true; saveState(state); celebrate(true); }
    }
    bindFxToggle(); bindSwitchStudent();
  }

  render();
})();
</script>
