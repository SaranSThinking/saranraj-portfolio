<meta charset="utf-8" />
<title>PROJECT AI - DOIE - AI &amp; ML Reasoning Atlas</title>
<style>
  :root {
    --bg: #FFF8F0;
    --surface: #FFFFFF;
    --surface-2: #FFEDE0;
    --border: #FFD3AE;
    --ink: #2B1B3D;
    --ink-muted: #8B7398;
    --accent: #FF5A36;
    --accent-ink: #FFFFFF;
    --accent-2: #00B894;
    --gold: #E8A200;
    --violet: #8B3DD6;
    --danger: #E63971;
    --lock: #D8C4CE;
    --line: #FFD3AE;
    --shadow: 0 8px 24px rgba(43,27,61,0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1A1033;
      --surface: #2A1B4D;
      --surface-2: #35225E;
      --border: #4A3170;
      --ink: #F5EEFF;
      --ink-muted: #B8A8D9;
      --accent: #FF7A50;
      --accent-ink: #1A1033;
      --accent-2: #2EFFC4;
      --gold: #FFD23F;
      --violet: #C77DFF;
      --danger: #FF5C8A;
      --lock: #503876;
      --line: #4A3170;
      --shadow: 0 8px 28px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1A1033;
    --surface: #2A1B4D;
    --surface-2: #35225E;
    --border: #4A3170;
    --ink: #F5EEFF;
    --ink-muted: #B8A8D9;
    --accent: #FF7A50;
    --accent-ink: #1A1033;
    --accent-2: #2EFFC4;
    --gold: #FFD23F;
    --violet: #C77DFF;
    --danger: #FF5C8A;
    --lock: #503876;
    --line: #4A3170;
    --shadow: 0 8px 28px rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    text-wrap: balance;
    font-weight: 400;
    letter-spacing: 0.2px;
  }
  .mono, .stat {
    font-family: Consolas, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.72rem;
    color: var(--ink-muted);
    font-weight: 600;
  }
  button { font-family: inherit; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- App shell ---------- */
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- Login screen ---------- */
  .login-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow: hidden;
  }
  .login-screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(1px 1px at 12% 22%, var(--ink-muted) 0, transparent 100%),
      radial-gradient(1px 1px at 78% 14%, var(--ink-muted) 0, transparent 100%),
      radial-gradient(1.8px 1.8px at 46% 68%, var(--accent) 0, transparent 100%),
      radial-gradient(1px 1px at 88% 62%, var(--ink-muted) 0, transparent 100%),
      radial-gradient(1.6px 1.6px at 30% 82%, var(--gold) 0, transparent 100%),
      radial-gradient(1.8px 1.8px at 62% 38%, var(--accent-2) 0, transparent 100%),
      radial-gradient(1.6px 1.6px at 20% 45%, var(--violet) 0, transparent 100%),
      radial-gradient(1px 1px at 8% 58%, var(--ink-muted) 0, transparent 100%),
      radial-gradient(1.6px 1.6px at 68% 85%, var(--violet) 0, transparent 100%);
    opacity: 0.65;
    pointer-events: none;
  }
  .login-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: var(--shadow);
    padding: 40px 36px;
    max-width: 420px;
    width: 100%;
  }
  .login-card .eyebrow { margin-bottom: 10px; }
  .login-card h1 { font-size: 2rem; margin: 0 0 8px; }
  .login-card p.sub { color: var(--ink-muted); margin: 0 0 28px; line-height: 1.55; font-size: 0.95rem; }
  .field-label {
    display: block;
    font-size: 0.78rem;
    color: var(--ink-muted);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .login-card input {
    width: 100%;
    padding: 12px 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--ink);
    font-size: 1rem;
    margin-bottom: 18px;
  }
  .login-card input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    padding: 13px 22px;
    border-radius: 3px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .login-foot { margin-top: 16px; font-size: 0.78rem; color: var(--ink-muted); text-align: center; }

  /* ---------- Atlas screen ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark { font-family: Georgia, serif; font-size: 1.3rem; letter-spacing: 0.02em; }
  .brand .tag { font-size: 0.78rem; color: var(--ink-muted); }
  .hud { display: flex; align-items: center; gap: 22px; }
  .hud-stat { display: flex; flex-direction: column; align-items: flex-end; }
  .hud-stat .num { font-size: 1.05rem; font-weight: 700; color: var(--accent); }
  .hud-stat .lbl { font-size: 0.68rem; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .hud-name { font-size: 0.85rem; color: var(--ink-muted); }
  .hud-name b { color: var(--ink); }
  .fx-toggle {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-muted);
    width: 34px; height: 34px; border-radius: 50%; font-size: 1rem; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .fx-toggle:hover { border-color: var(--accent); transform: scale(1.06); }
  .fx-toggle[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

  .atlas-wrap {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.9fr);
    gap: 0;
  }
  .atlas-main {
    padding: 28px 28px 60px;
    overflow-x: auto;
  }
  .atlas-main h2 { font-size: 1.5rem; margin: 0 0 4px; }
  .atlas-main .sub { color: var(--ink-muted); font-size: 0.92rem; margin: 0 0 24px; max-width: 60ch; line-height: 1.6; }

  .map-svg { width: 100%; height: auto; min-width: 560px; }
  .map-line { stroke: var(--line); stroke-width: 2; fill: none; }
  .map-line.done { stroke: var(--accent-2); }
  .node-group { cursor: pointer; }
  .node-group:focus-visible circle.node-ring { outline: 2px solid var(--ink); }
  .node-ring { fill: var(--surface); stroke: var(--lock); stroke-width: 2.5; transition: stroke 0.2s ease, fill 0.2s ease; }
  .node-group.active .node-ring { stroke: var(--accent); animation: pulse 2.2s ease-in-out infinite; }
  .node-group.done .node-ring { stroke: var(--accent-2); fill: var(--accent-2); }
  .node-group.locked .node-ring { stroke: var(--lock); }
  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(245,169,78,0)); }
    50% { filter: drop-shadow(0 0 7px var(--accent)); }
  }
  .node-icon { font-size: 20px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .node-group.locked .node-icon { opacity: 0.45; }
  .node-label { font-size: 12.5px; text-anchor: middle; fill: var(--ink); font-family: "Segoe UI", sans-serif; pointer-events: none; }
  .node-num { font-size: 10px; text-anchor: middle; fill: var(--ink-muted); font-family: Consolas, monospace; pointer-events: none; }

  .side-panel {
    border-left: 1px solid var(--border);
    background: var(--surface);
    padding: 26px 24px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .progress-block .eyebrow { margin-bottom: 10px; }
  .progress-bar-track {
    height: 8px;
    background: var(--surface-2);
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 5px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .progress-count { font-size: 0.8rem; color: var(--ink-muted); }

  .proofs-list { display: flex; flex-direction: column; gap: 10px; }
  .proof-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    background: var(--surface-2);
    border-radius: 3px;
    border: 1px solid var(--border);
    opacity: 0.4;
  }
  .proof-row.earned { opacity: 1; }
  .proof-icon { font-size: 1.1rem; width: 22px; text-align: center; }
  .proof-name { font-size: 0.82rem; }
  .proof-name .sub { display: block; font-size: 0.7rem; color: var(--ink-muted); }

  .how-block { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 16px; }
  .how-block h3 { font-size: 0.9rem; margin: 0 0 8px; }
  .how-block p { font-size: 0.8rem; color: var(--ink-muted); line-height: 1.6; margin: 0; }

  /* ---------- Level modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10,9,20,0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 50;
  }
  .modal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    box-shadow: var(--shadow);
    max-width: 620px; width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    padding: 30px 32px 28px;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
  .modal-head .eyebrow { color: var(--accent); }
  .modal-close {
    background: none; border: none; color: var(--ink-muted); font-size: 1.1rem;
    cursor: pointer; line-height: 1; padding: 4px;
  }
  .modal-close:hover { color: var(--ink); }
  .modal-card h2 { font-size: 1.35rem; margin: 4px 0 16px; }

  .scenario-box {
    background: var(--surface-2);
    border-left: 3px solid var(--accent);
    border-radius: 0 3px 3px 0;
    padding: 14px 16px;
    font-size: 0.92rem;
    line-height: 1.6;
    margin-bottom: 22px;
  }

  .step-label { font-size: 0.78rem; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .options { display: flex; flex-direction: column; gap: 9px; margin-bottom: 6px; }
  .option-btn {
    text-align: left;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px 14px;
    font-size: 0.88rem;
    line-height: 1.5;
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option-btn:hover { border-color: var(--accent); }
  .option-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .option-btn.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface-2)); }
  .option-btn.correct { border-color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 16%, var(--surface-2)); }
  .option-btn.wrong { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, var(--surface-2)); }
  .option-btn:disabled { cursor: default; }
  .option-letter { font-family: Consolas, monospace; font-weight: 700; margin-right: 8px; color: var(--ink-muted); }

  .hint-box {
    display: flex; gap: 10px; align-items: flex-start;
    background: color-mix(in srgb, var(--danger) 10%, var(--surface));
    border: 1px solid var(--danger);
    border-radius: 3px; padding: 12px 14px; margin-top: 14px;
    font-size: 0.85rem; line-height: 1.55;
  }
  .hint-box .tag { font-weight: 700; color: var(--danger); flex-shrink: 0; }

  .concept-reveal {
    margin-top: 22px;
    background: color-mix(in srgb, var(--accent-2) 10%, var(--surface));
    border: 1px solid var(--accent-2);
    border-radius: 4px;
    padding: 18px 20px;
  }
  .concept-reveal .eyebrow { color: var(--accent-2); margin-bottom: 8px; }
  .concept-reveal h3 { font-size: 1.05rem; margin: 0 0 10px; }
  .concept-reveal p, .concept-reveal li { font-size: 0.87rem; line-height: 1.65; color: var(--ink); }
  .concept-reveal ul { margin: 8px 0; padding-left: 20px; }
  .concept-reveal .xp-line {
    margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .xp-badge { font-size: 0.85rem; font-weight: 700; color: var(--accent-2); }

  .step-nav { display: flex; justify-content: flex-end; margin-top: 18px; gap: 10px; }
  .btn-ghost {
    background: transparent; border: 1px solid var(--border); color: var(--ink-muted);
    padding: 10px 16px; border-radius: 3px; font-size: 0.85rem; cursor: pointer;
  }
  .btn-ghost:hover { color: var(--ink); border-color: var(--ink-muted); }

  /* ---------- Completion screen ---------- */
  .complete-screen {
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 20px;
  }
  .complete-card {
    max-width: 560px; width: 100%; text-align: center;
    background: var(--surface); border: 1px solid var(--accent-2);
    border-radius: 5px; box-shadow: var(--shadow); padding: 44px 36px;
  }
  .complete-card .eyebrow { color: var(--accent-2); justify-content: center; display: block; margin-bottom: 10px; }
  .complete-card h1 { font-size: 2.1rem; margin: 0 0 14px; }
  .complete-card p.sub { color: var(--ink-muted); line-height: 1.6; margin: 0 0 26px; }
  .badge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 28px; }
  .badge-grid .proof-row { flex-direction: column; text-align: center; opacity: 1; padding: 12px 6px; }
  .badge-grid .proof-icon { font-size: 1.5rem; width: auto; }
  .badge-grid .proof-name { font-size: 0.7rem; }

  @media (max-width: 860px) {
    .atlas-wrap { grid-template-columns: 1fr; }
    .side-panel { border-left: none; border-top: 1px solid var(--border); }
    .badge-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* ---------- Bridge / capstone CTA ---------- */
  .cta-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .btn-capstone {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: var(--accent-ink); border: none; padding: 15px 22px; border-radius: 3px;
    font-size: 0.98rem; font-weight: 700; cursor: pointer; width: 100%;
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  .btn-capstone:hover { filter: brightness(1.06); }
  .btn-capstone:active { transform: scale(0.98); }

  /* ---------- Project Studio ---------- */
  .studio-wrap { flex: 1; padding: 30px 28px 70px; max-width: 900px; margin: 0 auto; width: 100%; }
  .studio-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
  .link-btn { background: none; border: none; color: var(--ink-muted); font-size: 0.82rem; cursor: pointer; padding: 4px 0; }
  .link-btn:hover { color: var(--accent); }
  .brief-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 5px;
    padding: 24px 26px; margin-bottom: 26px; box-shadow: var(--shadow);
  }
  .brief-card .eyebrow { color: var(--accent); margin-bottom: 8px; }
  .brief-card h1 { font-size: 1.7rem; margin: 0 0 12px; }
  .brief-card p { font-size: 0.92rem; line-height: 1.65; color: var(--ink); margin: 0 0 10px; }
  .brief-card p:last-child { margin-bottom: 0; }

  .milestone-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 5px;
    padding: 20px 24px; margin-bottom: 16px;
  }
  .milestone-card.locked { opacity: 0.5; }
  .milestone-card.done { border-color: var(--accent-2); }
  .milestone-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .milestone-head .eyebrow { margin-bottom: 4px; }
  .milestone-head h2 { font-size: 1.15rem; margin: 0; }
  .milestone-done-badge { font-size: 0.76rem; font-weight: 700; color: var(--accent-2); white-space: nowrap; padding-top: 4px; }
  .milestone-lock-note { font-size: 0.82rem; color: var(--ink-muted); margin-top: 4px; }
  .milestone-goal { font-size: 0.9rem; line-height: 1.6; margin: 10px 0 10px; }
  .milestone-why {
    background: var(--surface-2); border-left: 3px solid var(--accent-2); border-radius: 0 3px 3px 0;
    padding: 10px 14px; font-size: 0.84rem; line-height: 1.6; color: var(--ink); margin-bottom: 14px;
  }
  .milestone-why b.tag { color: var(--accent-2); }
  .checklist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .check-row { display: flex; align-items: flex-start; gap: 9px; font-size: 0.87rem; line-height: 1.5; cursor: pointer; }
  .check-row input[type="checkbox"] { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent-2); flex-shrink: 0; cursor: pointer; }
  .check-row.checked span { color: var(--ink-muted); text-decoration: line-through; text-decoration-color: var(--accent-2); }
  .guidance-box {
    background: color-mix(in srgb, var(--accent) 8%, var(--surface)); border: 1px solid var(--accent);
    border-radius: 3px; padding: 10px 14px; font-size: 0.83rem; line-height: 1.6; margin-bottom: 14px;
  }
  .guidance-box b.tag { color: var(--accent); }
  .reflect-label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .reflect-box {
    width: 100%; min-height: 90px; padding: 10px 12px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 3px; color: var(--ink); font-size: 0.87rem;
    font-family: inherit; line-height: 1.55; resize: vertical; margin-bottom: 6px;
  }
  .reflect-box:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .portfolio-tip { font-size: 0.78rem; color: var(--ink-muted); margin-bottom: 14px; }
  .portfolio-tip b.tag { color: var(--ink); }
  .milestone-actions { display: flex; justify-content: flex-end; }

  .packet-card {
    background: var(--surface); border: 1px solid var(--accent-2); border-radius: 5px;
    padding: 24px 26px; margin-top: 6px;
  }
  .packet-card h2 { font-size: 1.2rem; margin: 0 0 8px; }
  .packet-card .eyebrow { color: var(--accent-2); margin-bottom: 8px; }
  .packet-preview {
    width: 100%; min-height: 220px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 3px; padding: 12px 14px; font-family: Consolas, monospace; font-size: 0.78rem;
    line-height: 1.5; color: var(--ink); margin: 14px 0; white-space: pre-wrap;
  }
  .packet-status { font-size: 0.8rem; margin-top: 10px; color: var(--ink-muted); }
  .packet-status.err { color: var(--danger); }
  .packet-status.ok { color: var(--accent-2); }
</style>

<div id="app"></div>

<script>
(function () {
  "use strict";

  var STORAGE_PREFIX = "infer_atlas_state_v2_";

  /* ---------- admin progress log (Google Form -> your Sheet) ---------- *
   * Verified working: a real test POST landed correctly in "PROJECT AI - DOIE
   * - Student Progress Log" with every field in the right column before this
   * was wired in. Fire-and-forget from the browser - never blocks the UI, and
   * a failed/offline submission never breaks the student's local progress.
   */
  var PROGRESS_FORM_ACTION = "https://docs.google.com/forms/d/e/1FAIpQLSfnPmZXYD29j8F_O0PKAQcT_L1e6mCPp2ZFBm31PyMxbeE4Rw/formResponse";
  var PROGRESS_FORM_ENTRIES = {
    name: "entry.1842225061",
    roll: "entry.334818429",
    event: "entry.920747254",
    detail: "entry.1921175822",
    score: "entry.1825065818"
  };
  function logProgress(eventName, detail, score) {
    if (!state || !state.roll) return;
    try {

  function playBellStrike(ctx, freq, startTime, sizeScale) {
    // Real bells ring via a handful of slightly INHARMONIC partials (not a clean
    // integer-ratio overtone series like a plucked string) - that's what gives a
    // bell its "clang" rather than a plain beep. Each higher partial also decays
    // faster than the fundamental, the way a real bell's shimmer fades before its hum.
    var partials = [
      { ratio: 1.00, gain: 0.32, decay: 1.5 * sizeScale },
      { ratio: 2.00, gain: 0.20, decay: 1.2 * sizeScale },
      { ratio: 2.76, gain: 0.14, decay: 0.9 * sizeScale },
      { ratio: 4.07, gain: 0.09, decay: 0.6 * sizeScale },
      { ratio: 5.40, gain: 0.05, decay: 0.42 * sizeScale }
    ];
    partials.forEach(function (p) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq * p.ratio;
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.linearRampToValueAtTime(p.gain, startTime + 0.006); // near-instant strike
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + p.decay);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + p.decay + 0.05);
    });
  }

  function playChime(big) {
    if (!effectsEnabled()) return;
    var ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === "suspended") { ctx.resume().catch(function () {}); }
    var now = ctx.currentTime;
    if (big) {
      // a short celebratory peal - three ascending strikes
      [783.99, 987.77, 1318.51].forEach(function (freq, i) {
        playBellStrike(ctx, freq, now + i * 0.22, 1.15);
      });
    } else {
      // a single clean strike for everyday correct answers
      playBellStrike(ctx, 987.77, now, 0.75);
    }
  }

  var CONFETTI_COLORS = ["#FF5A36", "#00D9A3", "#FFB800", "#A855F7", "#FF3D77", "#3DDC97"];
  function fireConfetti(big) {
    if (!effectsEnabled()) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    var canvas = document.createElement("canvas");
    canvas.style.position = "fixed";
    canvas.style.inset = "0";
    canvas.style.pointerEvents = "none";
    canvas.style.zIndex = "999";
    document.body.appendChild(canvas);

    var dpr = window.devicePixelRatio || 1;
    function resize() {
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    }
    resize();
    var ctx2d = canvas.getContext("2d");
    ctx2d.scale(dpr, dpr);
    window.addEventListener("resize", resize);

    var count = big ? 150 : 80;
    var particles = [];
    for (var i = 0; i < count; i++) {
      var fromLeft = i % 2 === 0;
      var ox = fromLeft ? window.innerWidth * 0.06 : window.innerWidth * 0.94;
      var oy = window.innerHeight * 0.94;
      var angle = (fromLeft ? -1.0 : -2.1) + (Math.random() - 0.5) * 0.7;
      var speed = (big ? 12 : 8.5) + Math.random() * 6;
      particles.push({
        x: ox, y: oy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 4 + Math.random() * 5,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.35,
        shape: Math.random() < 0.55 ? "rect" : "circle"
      });
    }

    var gravity = 0.32;
    var start = performance.now();
    var duration = big ? 2600 : 1700;

    function frame(t) {
      var elapsed = t - start;
      ctx2d.clearRect(0, 0, window.innerWidth, window.innerHeight);
      var alive = false;
      particles.forEach(function (p) {
        p.vy += gravity * 0.06;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        var fade = Math.max(0, 1 - elapsed / duration);
        if (fade > 0) {
          alive = true;
          ctx2d.save();
          ctx2d.globalAlpha = fade;
          ctx2d.translate(p.x, p.y);
          ctx2d.rotate(p.rot);
          ctx2d.fillStyle = p.color;
          if (p.shape === "rect") {
            ctx2d.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
          } else {
            ctx2d.beginPath();
            ctx2d.arc(0, 0, p.size / 2, 0, Math.PI * 2);
            ctx2d.fill();
          }
          ctx2d.restore();
        }
      });
      if (alive && elapsed < duration) {
        requestAnimationFrame(frame);
      } else {
        window.removeEventListener("resize", resize);
        canvas.remove();
      }
    }
    requestAnimationFrame(frame);
  }

  function celebrate(big) {

    function tryBegin() {
      var roll = (rollInput.value || "").trim();
      var code = (codeInput.value || "").trim();
      errBox.style.display = "none";
      rollInput.style.borderColor = "";

      if (!roll || !code) { showError("Enter both your roll number and the class access code."); return; }
      if (code !== CLASS_CODE) { showError("That access code doesn't match - check with your instructor."); return; }

      if (!entry) { showError("That roll number isn't on the class roster. Check the spelling, or ask your instructor to add you."); return; }

      try { localStorage.setItem(LAST_ROLL_KEY, entry.roll); } catch (e) {}
      var existing = loadState(entry.roll);
      state = existing || freshState(entry.name, entry.roll);
      state.name = entry.name; // roster is the source of truth for display name

  /* ---------- atlas ---------- */
  function levelStatus(id) {
    if (state.cleared[id]) return "done";
    var prev = id - 1;
    if (prev === 0 || state.cleared[prev]) return "active";
    return "locked";
  }

  function buildMapSvg() {
    var n = LEVELS.length;
    var w = 720, h = 460;
    var pts = [];
    // organic zig-zag path across the "sky"
    var xs = [70, 190, 330, 470, 610, 480, 320, 170];
    var ys = [70, 150, 90, 160, 260, 340, 300, 400];
    for (var i = 0; i < n; i++) pts.push({ x: xs[i], y: ys[i] });

    var svg = '<svg class="map-svg" viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Level map">';

    for (var i = 0; i < n - 1; i++) {
      var a = pts[i], b = pts[i + 1];
      var doneLine = state.cleared[LEVELS[i].id] ? " done" : "";
      svg += '<path class="map-line' + doneLine + '" d="M' + a.x + ',' + a.y + ' L' + b.x + ',' + b.y + '"></path>';
    }

    for (var j = 0; j < n; j++) {
      var lvl = LEVELS[j];
      var st = levelStatus(lvl.id);
      var p = pts[j];
      var r = lvl.boss ? 30 : 26;
      svg += '<g class="node-group ' + st + '" tabindex="0" role="button" ' +
        'aria-label="Signal ' + lvl.id + ': ' + esc(lvl.title) + ' (' + st + ')" ' +
        'data-id="' + lvl.id + '">' +
          '<circle class="node-ring" cx="' + p.x + '" cy="' + p.y + '" r="' + r + '"></circle>' +
          '<text class="node-icon" x="' + p.x + '" y="' + (p.y - 2) + '">' + (st === "locked" ? "🔒" : (st === "done" ? "✓" : lvl.icon)) + '</text>' +
          '<text class="node-num" x="' + p.x + '" y="' + (p.y + r + 14) + '">SIGNAL ' + lvl.id + '</text>' +
          '<text class="node-label" x="' + p.x + '" y="' + (p.y + r + 30) + '">' + esc(lvl.title) + '</text>' +
        '</g>';
    }
    svg += '</svg>';
    return svg;
  }

  function renderAtlas() {
    var clearedCount = Object.keys(state.cleared).length;
    var pct = Math.round((clearedCount / LEVELS.length) * 100);

    var proofsHtml = LEVELS.map(function (lvl) {
      var earned = !!state.cleared[lvl.id];
      return '<div class="proof-row' + (earned ? ' earned' : '') + '">' +
        '<div class="proof-icon">' + (earned ? "✅" : lvl.icon) + '</div>' +
        '<div class="proof-name">' + esc(lvl.title) + '<span class="sub">' + esc(lvl.module) + '</span></div>' +
      '</div>';
    }).join("");

    app.innerHTML =
      '<div class="topbar">' +
        '<div class="brand"><span class="mark display">PROJECT AI - DOIE</span><span class="tag">AI &amp; ML Reasoning Atlas</span></div>' +
        '<div class="hud">' +
          '<div class="hud-name">Reasoner: <b>' + esc(state.name) + '</b></div>' +
          '<div class="hud-stat"><span class="num stat">' + state.xp + '</span><span class="lbl">Insight Pts</span></div>' +
          '<div class="hud-stat"><span class="num stat">' + clearedCount + '/' + LEVELS.length + '</span><span class="lbl">Signals Charted</span></div>' +
          switchStudentHtml() +
          fxToggleHtml() +
        '</div>' +
      '</div>' +
      '<div class="atlas-wrap">' +
        '<div class="atlas-main">' +
          '<h2 class="display">The Atlas</h2>' +
          '<p class="sub">Eight Signals, charted in order. Each one opens with a scenario - choose your approach, then justify it. Get both right to earn the Proof and unlock the next Signal.</p>' +
          buildMapSvg() +
        '</div>' +
        '<div class="side-panel">' +
          '<div class="progress-block">' +
            '<div class="eyebrow">Course Progress</div>' +
            '<div class="progress-bar-track"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div>' +
            '<div class="progress-count stat">' + pct + '% · ' + clearedCount + ' of ' + LEVELS.length + ' Signals charted</div>' +
          '</div>' +
          '<div class="proofs-block">' +
            '<div class="eyebrow">Proofs Earned</div>' +
            '<div class="proofs-list" style="margin-top:10px;">' + proofsHtml + '</div>' +
          '</div>' +
          '<div class="how-block">' +
            '<h3 class="display">How Signals work</h3>' +
            '<p>1. Read the scenario.<br>2. Choose your approach.<br>3. Choose your justification.<br>4. Miss either, and a hint nudges your thinking - it never hands you the answer.<br>5. Clear both, and the concept is revealed - you’ve just reasoned your way to it.</p>' +
          '</div>' +
        '</div>' +
      '</div>';

    var nodes = app.querySelectorAll(".node-group");
    nodes.forEach(function (node) {
      var id = parseInt(node.getAttribute("data-id"), 10);
      var status = levelStatus(id);
      function open() {
        if (status === "locked") return;
        openLevel(id);
      }
      node.addEventListener("click", open);
      node.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    });
    bindFxToggle();
    bindSwitchStudent();
  }

  /* ---------- level modal ---------- */
  function openLevel(id) {
    activeLevelId = id;
    stepIndex = 0;
    chosenApproach = null;
    chosenJustification = null;
    showHint = false;
    wrongAttempts = 0;
    render();
  }
  function closeLevel() {
    activeLevelId = null;
    render();
  }

  function getLevel(id) {
    for (var i = 0; i < LEVELS.length; i++) if (LEVELS[i].id === id) return LEVELS[i];
    return null;
  }

  function renderOptionList(options, chosenIdx, onPick, disabled) {
    var letters = ["A", "B", "C", "D"];
    return '<div class="options">' + options.map(function (opt, idx) {
      var cls = "option-btn";
      if (chosenIdx !== null) {
        if (idx === chosenIdx) cls += opt.c ? " correct" : " wrong";
        else if (opt.c && chosenIdx !== null && !options[chosenIdx].c) cls += ""; // don't reveal correct answer on miss
      }
      return '<button class="' + cls + '" data-idx="' + idx + '"' + (disabled ? " disabled" : "") + '>' +
        '<span class="option-letter">' + letters[idx] + '</span>' + esc(opt.t) +
      '</button>';
    }).join("") + '</div>';
  }

  function renderModal() {
    var lvl = getLevel(activeLevelId);
    if (!lvl) return;

    var body = "";
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";

    if (stepIndex === 0) {
      body =
        '<div class="scenario-box">' + esc(lvl.scenario) + '</div>' +
        '<div class="step-label">Step 1 of 2 - What approach would you take?</div>' +
        renderOptionList(lvl.approach, chosenApproach, null, chosenApproach !== null && !lvl.approach[chosenApproach].c ? false : chosenApproach !== null) +
        (showHint ? '<div class="hint-box"><span class="tag">Think again -</span><span>' + esc(lvl.hint) + ' <b>Pick another option below to try again.</b></span></div>' : '') +
        '<div class="step-nav">' +
          (chosenApproach !== null && lvl.approach[chosenApproach].c ? '<button class="btn-primary" id="nextStepBtn" style="width:auto;">Continue to justification →</button>' : '') +
        '</div>';
    } else if (stepIndex === 1) {
      body =
        '<div class="scenario-box">' + esc(lvl.scenario) + '</div>' +
        '<div class="step-label">Step 2 of 2 - Why is that the right approach?</div>' +
        renderOptionList(lvl.justification, chosenJustification, null, chosenJustification !== null && !lvl.justification[chosenJustification].c ? false : chosenJustification !== null) +
        (showHint ? '<div class="hint-box"><span class="tag">Not quite -</span><span>Reasoning matters as much as the answer. Re-read the approach you just picked - what made it correct? <b>Pick another option below to try again.</b></span></div>' : '') +
        '<div class="step-nav">' +
          (chosenJustification !== null && lvl.justification[chosenJustification].c ? '<button class="btn-primary" id="nextStepBtn" style="width:auto;">Reveal the concept →</button>' : '') +
        '</div>';
    } else {
      var alreadyCleared = !!state.cleared[lvl.id];
      var xpEarnedThisVisit = alreadyCleared ? 0 : Math.max(XP_MIN, XP_PER_LEVEL - wrongAttempts * XP_PENALTY_PER_WRONG);
      if (!alreadyCleared) {
        state.cleared[lvl.id] = true;
        state.xp += xpEarnedThisVisit;
        saveState(state);
        celebrate(!!lvl.boss);
        logProgress("Signal Cleared", lvl.title, xpEarnedThisVisit);
      }
      var xpNote = (!alreadyCleared && wrongAttempts > 0)
        ? '<div style="font-size:0.76rem;color:var(--ink-muted);margin-top:4px;">Full marks are ' + XP_PER_LEVEL + ' - ' + wrongAttempts + ' wrong pick' + (wrongAttempts === 1 ? "" : "s") + ' cost you ' + (XP_PER_LEVEL - xpEarnedThisVisit) + '.</div>'
        : '';
      body =
        '<div class="concept-reveal">' +
          '<div class="eyebrow">You reasoned your way here - now the concept</div>' +
          '<h3 class="display">' + esc(lvl.concept.h) + '</h3>' +
          lvl.concept.body.map(function (p) { return '<p>' + p + '</p>'; }).join("") +
          '<div class="xp-line">' +
            '<div><span class="xp-badge">✓ Proof earned: ' + esc(lvl.title) + '</span>' + xpNote + '</div>' +
            '<span class="mono" style="color:var(--accent-2);font-weight:700;">+' + (alreadyCleared ? 0 : xpEarnedThisVisit) + ' Insight Pts</span>' +
          '</div>' +
        '</div>' +
        '<div class="step-nav">' +
          '<button class="btn-primary" id="backToAtlasBtn" style="width:auto;">Back to the Atlas →</button>' +
        '</div>';
    }

    overlay.innerHTML =
      '<div class="modal-card">' +
        '<div class="modal-head">' +
          '<div><div class="eyebrow">Signal ' + lvl.id + (lvl.boss ? " · Capstone" : "") + ' · ' + esc(lvl.module) + '</div>' +
          '<h2 class="display">' + lvl.icon + '&nbsp; ' + esc(lvl.title) + '</h2></div>' +
          '<button class="modal-close" id="modalCloseBtn" aria-label="Close">✕</button>' +
        '</div>' +
        body +
      '</div>';

    document.body.appendChild(overlay);

    overlay.querySelector("#modalCloseBtn").addEventListener("click", closeLevel);
    overlay.addEventListener("click", function (e) { if (e.target === overlay) closeLevel(); });

    if (stepIndex === 0) {
      var aOpts = overlay.querySelectorAll(".options")[0].querySelectorAll(".option-btn");
      aOpts.forEach(function (btn, idx) {
        btn.addEventListener("click", function () {
          if (chosenApproach !== null && lvl.approach[chosenApproach].c) return;
          chosenApproach = idx;
          showHint = !lvl.approach[idx].c;
          if (showHint) wrongAttempts++;
          rerenderModalOnly(lvl);
        });
      });
      var next = overlay.querySelector("#nextStepBtn");
      if (next) next.addEventListener("click", function () { stepIndex = 1; showHint = false; rerenderModalOnly(lvl); });
    } else if (stepIndex === 1) {
      var jOpts = overlay.querySelectorAll(".options")[0].querySelectorAll(".option-btn");
      jOpts.forEach(function (btn, idx) {
        btn.addEventListener("click", function () {
          if (chosenJustification !== null && lvl.justification[chosenJustification].c) return;
          chosenJustification = idx;
          showHint = !lvl.justification[idx].c;
          if (showHint) wrongAttempts++;
          rerenderModalOnly(lvl);
        });
      });
      var next2 = overlay.querySelector("#nextStepBtn");
      if (next2) next2.addEventListener("click", function () { stepIndex = 2; rerenderModalOnly(lvl); });
    } else {
      overlay.querySelector("#backToAtlasBtn").addEventListener("click", function () {
        overlay.remove();
        closeLevel();
      });
    }

    window._inferOverlay = overlay;
  }

  function rerenderModalOnly(lvl) {
    if (window._inferOverlay) window._inferOverlay.remove();
    renderModal();
  }

  /* ---------- capstone project studio ---------- */
  function milestoneStatus(id) {
    var st = state.capstone.milestones[id];
    if (st.done) return "done";
    var prev = id - 1;
    if (prev === 0 || state.capstone.milestones[prev].done) return "active";
    return "locked";
  }

  function buildMilestoneCard(m) {
    var status = milestoneStatus(m.id);
    var ms = state.capstone.milestones[m.id];

    if (status === "locked") {
      return '<div class="milestone-card locked">' +
        '<div class="milestone-head"><div><div class="eyebrow">Milestone ' + m.id + ' · ' + esc(m.tie) + '</div>' +
        '<h2 class="display">' + esc(m.title) + '</h2></div></div>' +
        '<div class="milestone-lock-note">🔒 Complete Milestone ' + (m.id - 1) + ' first.</div>' +
      '</div>';
    }

    var checklistHtml = m.checklist.map(function (item, cidx) {
      var checked = ms.checks[cidx];
      return '<label class="check-row' + (checked ? ' checked' : '') + '">' +
        '<input type="checkbox" data-milestone="' + m.id + '" data-check="' + cidx + '"' + (checked ? " checked" : "") + ' />' +
        '<span>' + esc(item) + '</span>' +
      '</label>';
    }).join("");

    var allChecked = ms.checks.every(function (c) { return c; });

    return '<div class="milestone-card' + (status === "done" ? " done" : "") + '" data-mcard="' + m.id + '">' +
      '<div class="milestone-head">' +
        '<div><div class="eyebrow">Milestone ' + m.id + ' · ' + esc(m.tie) + '</div>' +

      '<div class="milestone-why"><b class="tag">Why it matters -</b> ' + esc(m.why) + '</div>' +

      '<div class="guidance-box"><b class="tag">Think about -</b> ' + esc(m.guidance) + '</div>' +
      '<label class="reflect-label" for="reflect-' + m.id + '">' + esc(m.reflectPrompt) + '</label>' +
      '<textarea class="reflect-box" id="reflect-' + m.id + '" data-milestone="' + m.id + '" placeholder="Write a few sentences - this feeds your portfolio packet.">' + esc(ms.reflection) + '</textarea>' +

  function setPacketStatus(container, msg, kind) {
    var el = container.querySelector("#packetStatus");

    el.textContent = msg;
    el.className = "packet-status" + (kind ? " " + kind : "");

  function handleDownloadPacket(container) {
    var md = buildReadmeMarkdown();
    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename: "PORTFOLIO-README.md", data: md }).then(function () {
        state.capstone.packetDownloaded = true;
        saveState(state);
        logProgress("Capstone Packet Downloaded", "", state.xp);
        setPacketStatus(container, "Saved - check your downloads, then drop it straight into your GitHub repo.", "ok");
      }).catch(function (err) {
        var code = err && err.code ? err.code : "unavailable";
        var msg = code === "declined"
          ? "No problem - you can copy the text below instead whenever you're ready."
          : "Couldn't save automatically (" + code + ") - copy the text below instead.";
        setPacketStatus(container, msg, "err");
      });
    } else {
      setPacketStatus(container, "Downloads aren't available in this preview - copy the text below instead.", "err");
    }

          '<div class="hud-name">Reasoner: <b>' + esc(state.name) + '</b></div>' +
          '<div class="hud-stat"><span class="num stat">' + state.xp + '</span><span class="lbl">Insight Pts</span></div>' +
          '<div class="hud-stat"><span class="num stat">' + clearedCount + '/' + LEVELS.length + '</span><span class="lbl">Signals Charted</span></div>' +
          switchStudentHtml() +
          fxToggleHtml() +
        '</div>' +
      '</div>' +
      '<div class="studio-wrap">' +
        '<div class="studio-nav"><button class="link-btn" id="backToAtlasNav">← Back to the Atlas</button></div>' +
        '<div class="brief-card">' +
          '<div class="eyebrow">Capstone Project</div>' +
          '<h1 class="display">' + esc(myCapstone.title) + '</h1>' +
          myCapstone.brief.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join("") +
        '</div>' +
        milestonesHtml +
        packetHtml +
      '</div>';

    document.getElementById("backToAtlasNav").addEventListener("click", function () {
      state.capstone.lastView = "bridge";
      saveState(state);
      render();
    });

    app.querySelectorAll('input[type="checkbox"][data-milestone]').forEach(function (cb) {
      cb.addEventListener("change", function () {
        var mid = parseInt(cb.getAttribute("data-milestone"), 10);
        var cidx = parseInt(cb.getAttribute("data-check"), 10);
        state.capstone.milestones[mid].checks[cidx] = cb.checked;
        saveState(state);
        render();
      });
    });

    app.querySelectorAll("textarea.reflect-box[data-milestone]").forEach(function (ta) {
      ta.addEventListener("input", function () {
        var mid = parseInt(ta.getAttribute("data-milestone"), 10);
        state.capstone.milestones[mid].reflection = ta.value;
        saveState(state);
      });
    });

    myCapstone.milestones.forEach(function (m) {
      var btn = document.getElementById("complete-" + m.id);
      if (btn) {
        btn.addEventListener("click", function () {
          state.capstone.milestones[m.id].done = true;
          saveState(state);
          celebrate(false);
          logProgress("Milestone Complete", m.title, "");
          render();
        });
      }
    });

    if (allMilestonesDone) {
      var preview = document.getElementById("packetPreview");
      if (preview) preview.value = buildReadmeMarkdown();
      var dlBtn = document.getElementById("downloadPacketBtn");
      if (dlBtn) dlBtn.addEventListener("click", function () { handleDownloadPacket(app); });
      if (!state.capstone.celebrated) {
        state.capstone.celebrated = true;
        saveState(state);
        celebrate(true);
        logProgress("Capstone Complete", "", state.xp);
      }
    }
    bindFxToggle();
    bindSwitchStudent();
  }

  render();
})();
</script>
