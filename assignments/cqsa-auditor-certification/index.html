  var state = null;

  function emptyWeekState() { return { practiceDone:false, practiceData:{}, performanceDone:false, performanceData:{} }; }
  function newState(roll, name) {
    var weeks = {};
    for (var i = 0; i < WEEKS.length; i++) weeks[WEEKS[i].id] = emptyWeekState();
    return { roll:roll, name:name, weeks:weeks, certIssued:false, certDate:null };
  }
  function loadState(roll) {
    try {
      var raw = localStorage.getItem(STORAGE_PREFIX + roll.toUpperCase());
      if (!raw) return null;
      var s = JSON.parse(raw);
      for (var i = 0; i < WEEKS.length; i++) if (!s.weeks[WEEKS[i].id]) s.weeks[WEEKS[i].id] = emptyWeekState();
      return s;
    } catch (e) { return null; }
  }
  function saveState() {
    if (!state) return;
    try { localStorage.setItem(STORAGE_PREFIX + state.roll.toUpperCase(), JSON.stringify(state)); } catch (e) {}
  }

  function weekUnlocked(weekId) {
    if (weekId === 1) return true;
    var prev = state.weeks[weekId - 1];
    return !!(prev && prev.performanceDone);
  }
  function weekDone(weekId) {
    var w = state.weeks[weekId];
    return !!(w && w.performanceDone);
  }
  function allGatesCleared() {
    return weekDone(15);
  }
  function gatesClearedCount() {
    var n = 0;
    for (var i = 0; i < WEEKS.length; i++) if (WEEKS[i].gate && weekDone(WEEKS[i].id)) n++;
    return n;
  }
  function weeksDoneCount() {
    var n = 0;
    for (var i = 0; i < WEEKS.length; i++) if (weekDone(WEEKS[i].id)) n++;
    return n;
  }

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (attrs[k] === null || attrs[k] === undefined) continue;
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;

      var entry = findRosterEntry(roll);

      if (code !== CLASS_CODE) { err.textContent = "Class code doesn't match."; err.style.display = "block"; return; }
      try { localStorage.setItem(LAST_ROLL_KEY, entry.roll); } catch (e) {}

  /* ---------- generic block renderer ---------- */
  function renderBlock(block, dataStore, disabled) {
    if (block.k === "info") {
      var box = el("div", { class:"block" });
      if (block.h) box.appendChild(el("h4", {}, [txt(block.h)]));
      var ibox = el("div", { class:"info-box" });
      block.p.forEach(function (para) { ibox.appendChild(el("p", {}, [txt(para)])); });
      box.appendChild(ibox);
      return box;
    }
    if (block.k === "gatenote") {
      return el("div", { class:"gate-note" }, [el("b", { class:"tag" }, [txt("Secure assessment: ")]), txt(block.p)]);
    }
    if (block.k === "fields") {
      var fbox = el("div", { class:"block" });
      fbox.appendChild(el("h4", {}, [txt(block.h)]));
      block.items.forEach(function (item) {
        var row = el("div", { class:"field-row" });
        row.appendChild(el("label", {}, [txt(item.label)]));
        var input = item.type === "textarea" ? el("textarea", { disabled: disabled ? "disabled" : null }) : el("input", { type:"text", disabled: disabled ? "disabled" : null });
        input.value = dataStore[item.id] || "";
        input.addEventListener("input", function () { dataStore[item.id] = input.value; });
        row.appendChild(input);
        fbox.appendChild(row);
      });
      return fbox;
    }
    if (block.k === "checklist") {
      var cbox = el("div", { class:"block" });
      cbox.appendChild(el("h4", {}, [txt(block.h)]));
      var arr = dataStore[block.id] || (dataStore[block.id] = []);
      block.items.forEach(function (label, idx) {
        var cb = el("input", { type:"checkbox" });
        cb.checked = !!arr[idx];
        if (disabled) cb.disabled = true;
        cb.addEventListener("change", function () { arr[idx] = cb.checked; });
        var lab = el("label", { class:"chk-row" }, [cb, el("span", {}, [txt(label)])]);
        cbox.appendChild(lab);
      });
      return cbox;
    }
    if (block.k === "table") {
      var tbox = el("div", { class:"block" });
      tbox.appendChild(el("h4", {}, [txt(block.h)]));
      var tableData = dataStore[block.id] || (dataStore[block.id] = []);
      var wrapDiv = el("div", { class:"tbl-wrap" });
      var table = el("table", { class:"fillable" });
      var thead = el("thead", {}, [el("tr", {}, block.cols.map(function (c) { return el("th", {}, [txt(c)]); }))]);
      table.appendChild(thead);
      var tbody = el("tbody");
      var nRows = block.rows;
      for (var r = 0; r < nRows; r++) {
        if (!tableData[r]) tableData[r] = [];
        var tr = el("tr");
        var colStart = 0;
        if (block.rowLabels) {
          tr.appendChild(el("td", { class:"rowlabel" }, [txt(block.rowLabels[r])]));
          colStart = 1;
        }
        for (var c = colStart; c < block.cols.length; c++) {
          (function (r, c) {
            var td = el("td");
            var ta = el("textarea", { disabled: disabled ? "disabled" : null });
            ta.value = tableData[r][c] || "";
            ta.addEventListener("input", function () { tableData[r][c] = ta.value; });
            td.appendChild(ta);
            tr.appendChild(td);
          })(r, c);
        }
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      wrapDiv.appendChild(table);
      tbox.appendChild(wrapDiv);
      return tbox;
    }
    return el("div");
  }

  /* ---------- Certificate ---------- */

  function downloadCertificate(statusEl) {
    var text = buildCertificateText();

    if (window.claude && window.claude.downloads && window.claude.downloads.save) {
      window.claude.downloads.save({ filename: filename, data: text }).then(function () {
        statusEl.textContent = "Downloaded " + filename;
        statusEl.className = "cert-status ok";
      }).catch(function (err) {
        statusEl.textContent = "Download unavailable here (" + ((err && err.code) || "unknown") + ") - copy the text below.";

        showCopyFallback(statusEl, text);

      showCopyFallback(statusEl, text);

  /* ---------- celebration (lightweight, reused pattern) ---------- */
  var CONFETTI_COLORS = ["#14497A", "#B8860B", "#2E7D5B", "#A63D4F", "#DCCEA0"];
  function fireConfetti(big) {
    var canvas = document.createElement("canvas");
    canvas.style.position = "fixed"; canvas.style.inset = "0"; canvas.style.pointerEvents = "none"; canvas.style.zIndex = "9999";
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    var ctx = canvas.getContext("2d");
    var particles = [];
    var n = big ? 140 : 70;
    for (var i = 0; i < n; i++) {
      var fromLeft = i % 2 === 0;
      particles.push({
        x: fromLeft ? 0 : canvas.width, y: canvas.height,
        vx: (fromLeft ? 1 : -1) * (Math.random() * 6 + 3), vy: -(Math.random() * 10 + 8),
        size: Math.random() * 5 + 3, color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
        rot: Math.random() * 360, vr: (Math.random() - 0.5) * 12, life: 0, maxLife: big ? 2.6 : 1.7
      });
    }
    var start = null;
    function frame(ts) {
      if (!start) start = ts;
      var dt = 0.016;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var alive = false;
      particles.forEach(function (p) {
        p.life += dt;
        if (p.life > p.maxLife) return;
        alive = true;
        p.vy += 22 * dt; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
        ctx.globalAlpha = Math.max(0, 1 - p.life / p.maxLife);
        ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });
      if (alive) requestAnimationFrame(frame); else canvas.remove();
    }
    requestAnimationFrame(frame);
  }
  function playBellStrike(ctx, freq, startTime, sizeScale) {
    var ratios = [1.0, 2.0, 2.76, 4.07, 5.4];
    var decays = [1.6, 1.1, 0.9, 0.6, 0.4];
    ratios.forEach(function (r, idx) {
      var osc = ctx.createOscillator(); var gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = freq * r;
      var peak = (0.18 / (idx + 1)) * sizeScale;
      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(peak, startTime + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + decays[idx] * sizeScale);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(startTime); osc.stop(startTime + decays[idx] * sizeScale + 0.1);
    });
  }
  function playChime(big) {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      if (big) { [523.25, 659.25, 783.99].forEach(function (f, i) { playBellStrike(ctx, f, ctx.currentTime + i * 0.16, 1.3); }); }
      else { playBellStrike(ctx, 659.25, ctx.currentTime, 0.9); }
    } catch (e) {}
  }
  function celebrate(big) { fireConfetti(big); playChime(big); }

  /* ---------- boot ---------- */
  render();
})();
